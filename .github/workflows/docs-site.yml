name: docs-site
on:
  push:
    branches: [main]
    paths: ["website/landing/**", ".github/workflows/docs-site.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether GitHub Pages is enabled
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getPages({ ...context.repo });
              core.setOutput('enabled', 'true');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.notice('GitHub Pages is not enabled; skipping deployment.');
              core.setOutput('enabled', 'false');
            }
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: website/landing
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.pages.outputs.enabled == 'true'
