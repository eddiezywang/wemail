<!doctype html>
<html lang="en" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/ai-panel-logo.png" />
    <title>WeMail</title>
    <script>
      (() => {
        const storageKey = "wemail.theme";
        const migratedKey = "wemail.theme.migrated.stone-default";
        const themes = new Set(["system", "paper", "dark", "claude"]);
        let theme = "system";
        try {
          const migrated = window.localStorage.getItem(migratedKey);
          let storedTheme = window.localStorage.getItem(storageKey);
          if (!migrated && storedTheme === "claude") {
            storedTheme = "paper";
            window.localStorage.setItem(storageKey, "paper");
            window.localStorage.setItem(migratedKey, "1");
          }
          if (themes.has(storedTheme)) theme = storedTheme;
        } catch {}
        document.documentElement.dataset.theme =
          theme === "system" &&
          window.matchMedia?.("(prefers-color-scheme: dark)").matches
            ? "dark"
            : theme === "system"
              ? "paper"
              : theme;
      })();
    </script>
  </head>
  <body class="bg-canvas text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
